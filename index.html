<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0d14">
<title>LE FACE-À-FACE · s'entraîner aux conversations difficiles</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face-à-face">
<style>
:root{
  --bg:#0c0d14; --bg2:#12141f; --card:#171a27; --card2:#1f2333;
  --ink:#eef0f8; --mut:#a3a9c2; --dim:#6b7290;
  --hot:#ff5f6d; --hot2:#ff8a94; --cool:#5ad1ff; --amb:#ffd76b; --grn:#46d38a; --vio:#a98bff;
  --line:#262b3d; --line2:#333a52;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --r:16px; --r2:12px; --r3:9px; --hh:47px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 460px at 50% -12%, #1b1d30 0%, var(--bg) 58%) fixed;
  color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:620px; margin:0 auto; padding:0 13px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:22px; margin:16px 0 4px; letter-spacing:-.3px}
h2{margin:0; font-size:16px}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
textarea,input,select{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,rgba(12,13,20,.97),rgba(12,13,20,.84)); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:calc(8px + env(safe-area-inset-top)) 13px 8px}
.hbar{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:10px}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.4px; font-size:16px}
.logo .k{width:26px; height:26px; display:grid; place-items:center; background:linear-gradient(135deg,var(--hot),var(--vio)); color:#fff; border-radius:8px; font-size:14px; box-shadow:0 3px 12px rgba(255,95,109,.35)}
.logo b{background:linear-gradient(90deg,var(--hot2),var(--amb));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hspace{flex:1}
.rankchip{text-align:right}
.rankchip #rankName{font-size:11px; font-weight:700; color:var(--amb)}
.xpwrap{display:flex; align-items:center; gap:6px; justify-content:flex-end}
#xpNum{font-size:10px; color:var(--dim)}
.xptrack{width:66px; height:5px; background:var(--line); border-radius:4px; overflow:hidden}
#xpBar{display:block; height:100%; background:linear-gradient(90deg,var(--hot),var(--amb)); border-radius:4px; transition:width .5s}

/* ---------- nav ---------- */
#nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center; gap:2px;
  background:linear-gradient(0deg,rgba(12,13,20,.99),rgba(12,13,20,.9)); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-item{flex:1; max-width:112px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:12px; color:var(--dim); transition:.15s}
.nav-item .ni-e{font-size:18px; filter:grayscale(.45) opacity(.7); transition:.15s}
.nav-item .ni-t{font-size:10px; font-weight:600}
.nav-item.active{color:var(--hot2); background:rgba(255,95,109,.08)}
.nav-item.active .ni-e{filter:none; transform:translateY(-1px)}

/* ---------- generic ---------- */
.v-sub{color:var(--mut); font-size:13.5px; line-height:1.55; margin:4px 0 14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:0 0 13px; box-shadow:var(--shadow)}
.card.tight{padding:12px}
.hint{color:var(--mut); font-size:12.5px; line-height:1.55; background:var(--bg2); border:1px solid var(--line); border-radius:var(--r3); padding:10px 12px; margin:10px 0}
.hint b{color:var(--ink)}
.muted{color:var(--dim); font-size:12.5px; line-height:1.5}
.lbl{font-size:10.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.7px; margin:2px 0 8px}
.btn{background:var(--card2); border:1px solid var(--line2); color:var(--ink); font-weight:600; font-size:13.5px; padding:10px 14px; border-radius:11px; transition:.12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--hot),#e0484f); color:#fff; border:none}
.btn.cool{background:rgba(90,209,255,.14); border-color:rgba(90,209,255,.5); color:var(--cool)}
.btn.ghost{background:transparent}
.btn.on{background:rgba(255,95,109,.16); border-color:var(--hot); color:var(--hot2)}
.btn.big{width:100%; padding:14px; font-size:15px}
.btn.sm{padding:7px 11px; font-size:12px; border-radius:9px}
.btn:disabled{opacity:.45}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--card2); color:var(--mut); border:1px solid var(--line2)}
.pill.hot{background:rgba(255,95,109,.14); color:var(--hot2); border-color:rgba(255,95,109,.4)}
.pill.cool{background:rgba(90,209,255,.12); color:var(--cool); border-color:rgba(90,209,255,.35)}
.pill.grn{background:rgba(70,211,138,.14); color:var(--grn); border-color:rgba(70,211,138,.4)}
.pill.amb{background:rgba(255,215,107,.13); color:var(--amb); border-color:rgba(255,215,107,.35)}
.row{display:flex; align-items:center; gap:10px}

/* ---------- jauges ---------- */
#gauges{position:sticky; top:var(--hh,47px); z-index:20; background:linear-gradient(180deg,rgba(12,13,20,.98),rgba(12,13,20,.9)); backdrop-filter:blur(8px); padding:8px 0 9px; margin:0 -13px 12px; padding-left:13px; padding-right:13px; border-bottom:1px solid var(--line)}
.g-row{display:flex; gap:9px}
.g{flex:1}
.g-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px}
.g-n{font-size:10px; font-weight:700; color:var(--dim); letter-spacing:.3px}
.g-v{font-size:10px; font-weight:800; color:var(--mut); font-variant-numeric:tabular-nums}
.g-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden}
.g-fill{display:block; height:100%; border-radius:4px; transition:width .45s cubic-bezier(.2,.8,.3,1)}
.g.pos .g-fill{background:linear-gradient(90deg,#e0484f,var(--hot2))}
.g.lien .g-fill{background:linear-gradient(90deg,#2fa76d,var(--grn))}
.g.tenue .g-fill{background:linear-gradient(90deg,#3a9dc4,var(--cool))}
.delta{font-size:10px; font-weight:800; margin-left:4px}
.delta.up{color:var(--grn)} .delta.down{color:var(--hot)}

/* ---------- dialogue ---------- */
#fil{display:flex; flex-direction:column; gap:11px; margin-bottom:14px}
.beat{animation:in .28s ease}
@keyframes in{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
.didasc{color:var(--dim); font-size:12px; font-style:italic; line-height:1.5; padding:0 4px}
.said{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--hot); border-radius:4px 14px 14px 14px; padding:11px 13px}
.said .who{font-size:10.5px; font-weight:800; color:var(--hot2); letter-spacing:.4px; text-transform:uppercase; margin-bottom:5px}
.said p{margin:0; font-size:15px; line-height:1.5}
.mine{align-self:flex-end; max-width:92%; background:rgba(90,209,255,.1); border:1px solid rgba(90,209,255,.32); border-radius:14px 4px 14px 14px; padding:10px 13px}
.mine .who{font-size:10.5px; font-weight:800; color:var(--cool); letter-spacing:.4px; text-transform:uppercase; margin-bottom:4px}
.mine p{margin:0; font-size:14.5px; line-height:1.5}
.reac{color:var(--mut); font-size:13.5px; line-height:1.5; padding:2px 6px; font-style:italic}

/* ---------- options ---------- */
.opts{display:flex; flex-direction:column; gap:9px}
.opt{width:100%; text-align:left; background:var(--card); border:1px solid var(--line2); border-radius:13px; padding:12px 13px; font-size:14px; line-height:1.45; transition:.12s}
.opt:active{transform:scale(.985); border-color:var(--hot)}
.opt .oi{font-size:10px; font-weight:800; color:var(--dim); letter-spacing:.5px; margin-right:6px}

/* ---------- zone libre ---------- */
#libre textarea{width:100%; min-height:86px; background:var(--bg2); border:1px solid var(--line2); border-radius:12px; color:var(--ink); font-size:15px; line-height:1.5; padding:11px 12px; resize:vertical}
#libre textarea:focus{outline:none; border-color:var(--cool)}
.chrono{font-size:12px; font-weight:800; color:var(--amb); font-variant-numeric:tabular-nums}
.chrono.warn{color:var(--hot)}

/* ---------- analyse ---------- */
.an{margin-top:12px}
.an-item{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border-radius:10px; margin-bottom:7px; font-size:13px; line-height:1.5; border:1px solid var(--line)}
.an-item.ok{background:rgba(70,211,138,.07); border-color:rgba(70,211,138,.28)}
.an-item.ko{background:rgba(255,95,109,.07); border-color:rgba(255,95,109,.26)}
.an-item .ic{font-size:14px; line-height:1.3}
.an-item b{display:block; margin-bottom:2px}
.an-item .why{color:var(--mut); font-size:12.5px}
.score-big{font-size:30px; font-weight:800; letter-spacing:-1px}

/* ---------- debrief ---------- */
.verdict{text-align:center; padding:20px 14px}
.verdict .e{font-size:44px; display:block; margin-bottom:6px}
.verdict .t{font-size:19px; font-weight:800; margin-bottom:6px; line-height:1.3}
.verdict .d{color:var(--mut); font-size:13.5px; line-height:1.55}
.tour-rev{border-top:1px solid var(--line); padding:12px 0}
.tour-rev:first-of-type{border-top:none}
.tour-rev .tq{font-size:11px; font-weight:800; letter-spacing:.4px; text-transform:uppercase}
.q3{color:var(--grn)} .q2{color:var(--amb)} .q1{color:var(--hot2)} .q0{color:var(--hot)}
.tour-rev .played{font-size:13.5px; line-height:1.5; margin:5px 0}
.tour-rev .why{color:var(--mut); font-size:12.5px; line-height:1.55; margin:5px 0}
.tour-rev .best{background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13px; line-height:1.5; color:var(--cool); margin-top:6px}

/* ---------- listes ---------- */
.item{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:10px; transition:.12s}
.item:active{transform:scale(.99)}
.item .em{font-size:24px; line-height:1.1}
.item .ti{font-size:15px; font-weight:700; margin-bottom:3px}
.item .de{color:var(--mut); font-size:12.5px; line-height:1.5}
.item .meta{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap}
.niv{display:inline-flex; gap:2px}
.niv i{width:5px; height:5px; border-radius:50%; background:var(--line2); display:block}
.niv i.on{background:var(--hot)}
.filters{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.filters .btn{white-space:nowrap; flex-shrink:0}
details.fiche{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 13px; margin-bottom:9px}
details.fiche summary{list-style:none; cursor:pointer; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary .cat{margin-left:auto}
details.fiche .body{padding-top:10px; font-size:13.5px; line-height:1.6; color:var(--mut)}
details.fiche .body b{color:var(--ink)}
details.fiche .ex{background:rgba(70,211,138,.07); border:1px solid rgba(70,211,138,.25); border-radius:9px; padding:9px 11px; margin:8px 0 0; color:var(--ink)}
details.fiche .pas{background:rgba(255,95,109,.07); border:1px solid rgba(255,95,109,.24); border-radius:9px; padding:9px 11px; margin:8px 0 0; color:var(--ink)}

/* ---------- divers ---------- */
.stat{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.stat:last-child{border-bottom:none}
.stat b{font-variant-numeric:tabular-nums}
.toggle{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); gap:12px}
.toggle:last-of-type{border-bottom:none}
.toggle .tt{font-size:13.5px; font-weight:600}
.toggle .td{color:var(--dim); font-size:11.5px; line-height:1.45; margin-top:2px}
.sw{width:46px; height:27px; border-radius:20px; background:var(--line2); position:relative; flex-shrink:0; transition:.2s}
.sw.on{background:var(--hot)}
.sw i{position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:.2s}
.sw.on i{left:22px}
.seg{display:flex; gap:0; background:var(--bg2); border:1px solid var(--line2); border-radius:10px; overflow:hidden}
.seg button{flex:1; padding:8px 6px; font-size:12px; font-weight:700; color:var(--dim)}
.seg button.on{background:var(--hot); color:#fff}
.streakbig{font-size:26px; font-weight:800; letter-spacing:-.5px}
.done{opacity:.55}
.card.fait{border-color:rgba(70,211,138,.35)}
.center{text-align:center}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><span class="k">⚔️</span><span>LE <b>FACE-À-FACE</b></span></div>
    <div class="hspace"></div>
    <div class="rankchip">
      <div id="rankName">Débutant</div>
      <div class="xpwrap"><span id="xpNum">0</span><span class="xptrack"><i id="xpBar" style="width:0%"></i></span></div>
    </div>
  </div>
</header>
<div id="app"></div>
<nav id="nav"></nav>
<script src="moteur.js"></script>
<script src="scenarios-pro.js"></script>
<script src="scenarios-conflit.js"></script>
<script src="scenarios-perso.js"></script>
<script src="fiches.js"></script>
<script src="app.js"></script>
</body>
</html>
